# Materia CI (Step 9) — the robot inspector.
#
# Runs on every push and pull request: lints + tests the backend, and lints +
# tests + builds the frontend. Kept fast (< ~2 min) by installing the slim
# requirements-test.txt instead of the full ~4 GB ML stack, which the web process
# and the structure/VASP tests don't need.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (ruff — real errors only)
        run: ruff check app tests --select F,E9

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend — lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm install` (not `npm ci`) so the lockfile is regenerated if the test
      # devDependencies (vitest/jsdom) were added without committing a new lock.
      - name: Install dependencies
        run: npm install

      # Advisory for now: the existing components carry ~16 react-hooks lint
      # violations that predate the test net. Surfaced but non-blocking until
      # they're cleaned up, so CI gates on the things Step 9 actually added.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
