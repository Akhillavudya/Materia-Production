# Materia Desktop — Part C / C3 release matrix.
#
# Trigger: push a tag like `v0.1.0` (keep it in sync with desktop/package.json
# "version"). For each OS we build the PyInstaller backend NATIVELY (torch is not
# cross-compilable), build the SPA, then electron-builder packages + publishes the
# installer to a GitHub Release. electron-updater clients read that release feed.
#
# Manual dry runs: `workflow_dispatch` builds the installers without publishing.

name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # electron-builder needs to create/update the Release

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one OS failing shouldn't kill the other installers
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash        # bash is present on all three runners; keeps steps uniform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1) Freeze the backend with CPU-only torch (smaller, runs everywhere — no CUDA).
      #    Install the torch family first from the CPU wheel index, then the rest with
      #    the legacy resolver (mirrors backend/Dockerfile so the proven combo holds).
      - name: Install backend deps (CPU torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 \
            --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision torchaudio
          pip install --retries 5 --timeout 120 \
            --use-deprecated=legacy-resolver -r requirements-desktop.txt

      - name: Freeze backend (PyInstaller)
        working-directory: desktop
        run: python scripts/build_backend.py

      # 2) Build the React SPA with a file://-safe relative base (→ resources/spa).
      - name: Build SPA
        working-directory: frontend
        run: |
          npm install
          npx vite build --base=./ --outDir ../desktop/resources/spa --emptyOutDir

      # 3) Package + publish the installer for this OS.
      #    `npm install` (not ci) so the lockfile tolerates the C3 dep additions.
      - name: Install electron tooling
        working-directory: desktop
        run: npm install

      - name: Build & publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run dist -- --publish always
          else
            npm run dist -- --publish never
          fi

      # On a manual dry run, keep the artifacts so they can be downloaded + tested.
      - name: Upload installers (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: materia-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: ignore
